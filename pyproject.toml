[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whispertype"
version = "0.1.0"
description = "Free local-first voice typing for macOS. Hold a hotkey, speak, get clean text pasted into any app."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "faster-whisper>=1.0.3",
  "pynput>=1.7.7",
  "sounddevice>=0.5.0",
  "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
  "pyobjc-framework-AVFoundation>=10.0; sys_platform == 'darwin'",
]

[project.scripts]
whispertype = "app.mac_dictation.cli:main"
whispertype-build-app = "app.mac_dictation.app_bundle:main"
whispertype-doctor = "app.mac_dictation.doctor:main"
whispertype-paste-test = "app.mac_dictation.paste_test:main"
whispertype-dev-restart = "app.mac_dictation.dev_restart:main"

[project.optional-dependencies]
dev = ["pytest>=8.2.0"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*", "tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
