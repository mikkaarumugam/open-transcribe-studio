[project]
name = "open-transcribe-studio"
version = "0.1.0"
description = "Free local-first Glaido-inspired transcription studio for uploads, microphone recordings, exports, and transcript intelligence."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
  "jinja2>=3.1.4",
  "pydantic>=2.8.0",
  "faster-whisper>=1.0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0", "httpx>=0.27.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
